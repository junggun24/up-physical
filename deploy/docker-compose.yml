# 로컬 개발 인프라 — Postgres(데이터+잡큐) + MinIO(오브젝트 스토리지).
# 기동: cd deploy && docker compose up -d
# 계정은 로컬 전용. stage/prod 는 별도 시크릿 주입 (커밋 금지 — .env는 gitignore).
services:
  postgres:
    image: postgres:16-alpine
    container_name: upx-postgres
    environment:
      POSTGRES_USER: upx
      POSTGRES_PASSWORD: upx
      POSTGRES_DB: upphysical
    ports:
      - "5433:5432"   # 호스트 5432는 로컬 Postgres가 점유 → 5433으로 노출
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upx -d upphysical"]
      interval: 2s
      timeout: 2s
      retries: 15

  minio:
    image: minio/minio:latest
    container_name: upx-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
  miniodata:
